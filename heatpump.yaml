# =============================================================================
# Panasonic Aquarea K-series 5 kW - ESPHome configuration
#
# Node: heatpump | ESP32-C3 | UART 9600 8E1 on GPIO3 (TX) / GPIO4 (RX)
# Component: kenavru/esphome_components, branch feature/panasonic-heishamon-k-series
# Fork extras: TOP170-TOP198 telemetry, signed heater deltas, extra controls.
#
# Backup-heater settings (what each one does):
#   Set Heater Start Delta      set22  -10..0 K   heater starts at target + delta
#   Set Heater Stop Delta       set23  -10..0 K   heater stops at target + delta
#   Set Heater Delay Time       set21  0..60 min  delay before the heater may start
#   Set Heater On Outdoor Temp  set46  -20..20 C  heater allowed only below this
#   Set Room Heater State       set45  Blocked/Free
#   Set DHW Heater State        set44  Blocked/Free
#
# The master "Backup Heater Enable" (top167) is READ-ONLY over CN-CNT.
# Disable it on the pump: hold Menu ~10 s -> Custom menu -> Back-up heater ->
# "Do not use". Frost/defrost/heat-exchanger protection can still use the heater.
# =============================================================================

# Keep this file next to your secrets.yaml.

esphome:
  name: heatpump
  friendly_name: heatpump

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3

external_components:
  - source:
      type: git
      url: https://github.com/kenavru/esphome_components
      ref: feature/panasonic-heishamon-k-series
    components: [ panasonic_heatpump ]

time:
  - platform: homeassistant
    id: ha_time

logger:
  baud_rate: 0

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true

captive_portal:

uart:
  - id: uart_heatpump
    tx_pin: GPIO3
    rx_pin: GPIO4
    baud_rate: 9600
    data_bits: 8
    parity: EVEN
    stop_bits: 1

# Polling / UART:
#   update_interval: how often the pump is polled
#   request_send_interval: gap between queued UART requests (raise if checksum errors)
#   uart_client_timeout: fallback polling when a CZ-TAW1 stops requesting
#   log_uart_msg: verbose UART logging (diagnostics only)
panasonic_heatpump:
  id: my_heatpump
  uart_id: uart_heatpump
  # Set to true only while diagnosing; it floods the log with every UART frame.
  log_uart_msg: false
  update_interval: 5s
  # Space UART requests so commands are not lost to bus collisions.
  # The component default is 250ms; slower pumps need 1s or 1500ms.
  request_send_interval: 1s
  uart_client_timeout: 10s

