    name: Heat Power Consumption Daily
    power_id: heat_power_consumption
    time_id: ha_time
    unit_of_measurement: kWh
    state_class: total_increasing
    device_class: energy
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
  - platform: total_daily_energy
    name: Cool Power Consumption Daily
    power_id: cool_power_consumption
    time_id: ha_time
    unit_of_measurement: kWh
    state_class: total_increasing
    device_class: energy
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
  - platform: total_daily_energy
    name: DHW Power Consumption Daily
    power_id: dhw_power_consumption
    time_id: ha_time
    unit_of_measurement: kWh
    state_class: total_increasing
    device_class: energy
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: template
    name: "COP Heating"
    unit_of_measurement: "COP"
    accuracy_decimals: 2
    state_class: measurement
    update_interval: 30s
    lambda: |-
      if (id(heat_power_production_extra).state > 0 &&
          id(heat_power_consumption_extra).state > 0) {
        return id(heat_power_production_extra).state /
               id(heat_power_consumption_extra).state;
      }
      return 0.0;

  - platform: template
    name: "COP Cooling"
    unit_of_measurement: "COP"
    accuracy_decimals: 2
    state_class: measurement
    update_interval: 30s
    lambda: |-
      if (id(cool_power_production_extra).state > 0 &&
          id(cool_power_consumption_extra).state > 0) {
        return id(cool_power_production_extra).state /
               id(cool_power_consumption_extra).state;
      }
      return 0.0;

  - platform: template
    name: "COP DHW"
    unit_of_measurement: "COP"
    accuracy_decimals: 2
    state_class: measurement
    update_interval: 30s
    lambda: |-
      if (id(dhw_power_production_extra).state > 0 &&
          id(dhw_power_consumption_extra).state > 0) {
        return id(dhw_power_production_extra).state /
               id(dhw_power_consumption_extra).state;
      }
      return 0.0;

