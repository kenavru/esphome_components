number:
  - platform: panasonic_heatpump
    # --- Zone temperatures ---
    # Z1 heat request: shift -5..5 in curve/shift mode, absolute 20..60 in Direct mode.
    set5:
      name: "Set Z1 Heat Request Temperature"
      # Direct heating mode: absolute water target (K-series 20..60 °C).
      # Use -5..5 instead if you switch the heat pump to shift/compensation mode.
      min_value: 20
      max_value: 60
      step: 1
    # Z1 cool request: shift -5..5, or absolute 5..20 in Direct cool.
    set6:
      name: "Set Z1 Cool Request Temperature"
    # Z2 heat request (same rules as set5).
    set7:
      name: "Set Z2 Heat Request Temperature"
      min_value: 20
      max_value: 60
      step: 1
    # Z2 cool request (same rules as set6).
    set8:
      name: "Set Z2 Cool Request Temperature"
    # --- DHW / pump ---
    # DHW target temperature (40..75 °C).
    set11:
      name: "Set DHW Temp"
    # Maximum pump duty (service value, 64..254).
    set15:
      name: "Set Max Pump Duty"
    # --- Zone curves / deltas ---
    # Zone heating/cooling curve points (used only in Compensation curve mode).
    set16_01:
      name: "Set Zone1 Heat Target High"
    set16_02:
      name: "Set Zone1 Heat Target Low"
    set16_03:
      name: "Set Zone1 Heat Outside Low"
    set16_04:
      name: "Set Zone1 Heat Outside High"
    set16_05:
      name: "Set Zone2 Heat Target High"
    set16_06:
      name: "Set Zone2 Heat Target Low"
    set16_07:
      name: "Set Zone2 Heat Outside Low"
    set16_08:
      name: "Set Zone2 Heat Outside High"
    set16_09:
      name: "Set Zone1 Cool Target High"
    set16_10:
      name: "Set Zone1 Cool Target Low"
    set16_11:
      name: "Set Zone1 Cool Outside Low"
    set16_12:
      name: "Set Zone1 Cool Outside High"
    set16_13:
      name: "Set Zone2 Cool Target High"
    set16_14:
      name: "Set Zone2 Cool Target Low"
    set16_15:
      name: "Set Zone2 Cool Outside Low"
    set16_16:
      name: "Set Zone2 Cool Outside High"
    # Floor heating delta (1..15 K).
    set18:
      name: "Set Floor Heat Delta"
    # Floor cooling delta (1..15 K).
    set19:
      name: "Set Floor Cool Delta"
    # DHW reheat delta (-12..-2 K).
    set20:
      name: "Set DHW Heat Delta"
    # --- Backup heater ---
    # Backup heater delay: 0..60 min (K-series clamps above 60).
    set21:
      name: "Set Heater Delay Time"
      # K-series clamps this at 60 min: values above 60 revert to 60.
      min_value: 0
      max_value: 60
      step: 1
    # Backup heater start delta: -10..0 K (K-series clamps below -10).
    set22:
      name: "Set Heater Start Delta"
      # K-series clamps this at -10 K: values below -10 revert to -10.
      min_value: -10
      max_value: 0
      step: 1
    # Backup heater stop delta: -10..0 K.
    set23:
      name: "Set Heater Stop Delta"
      # K-series range observed: -10 .. 0 K.
      min_value: -10
      max_value: 0
      step: 1
    # --- Buffer / heating / bivalent ---
    # Buffer tank delta (0..10 K).
    set27:
      name: "Set Buffer Delta"
    # Outdoor temperature at which heating stops (5..35 °C).
    set29:
      name: "Set Heating Off Outdoor Temp"
    # Bivalent start temperature (-15..35 °C).
    set36:
      name: "Set Bivalent Start Temp"
    # Bivalent advanced-parallel start temperature (-15..35 °C).
    set37:
      name: "Set Bivalent AP Start Temp"
      min_value: -15
      max_value: 35
      step: 1
    # Bivalent advanced-parallel stop temperature (-15..35 °C).
    set38:
      name: "Set Bivalent AP Stop Temp"
      min_value: -15
      max_value: 35
      step: 1
    # Outdoor temperature for backup heater ON: -20..20 °C (-20 = effectively off).
    set46:
      name: "Set Heater On Outdoor Temp"
      min_value: -20
      max_value: 20
      step: 1
    # Outdoor temperature for automatic Heat -> Cool switching (11..25 °C).
    set47:
      name: "Set Heat To Cool Temp"
    # Outdoor temperature for automatic Cool -> Heat switching (5..14 °C).
    set48:
      name: "Set Cool To Heat Temp"
    # --- new HeishaMon parity numbers ---
    # --- Sterilization / timing ---
    # DHW sterilization target (55..75 °C).
    set_sterilization_temp:
      name: "Set Sterilization Temp"
    # DHW sterilization hold time (5..60 min, 5-min steps).
    set_sterilization_max_time:
      name: "Set Sterilization Max Time"
    # Max room heating time before DHW (30..7620 min, 30-min steps).
    set_room_operation_max_time:
      name: "Set Room Operation Max Time"
    # Max DHW heat-up time (1..254 min).
    set_dhw_heatup_max_time:
      name: "Set DHW Heatup Max Time"

switch:
  - platform: panasonic_heatpump
    # --- Main / service ---
    # Heat pump ON/OFF (same as the remote ON/OFF).
    set1:
      name: "Set Heatpump"
    # Force DHW (only effective if the operation mode includes TANK).
    set10:
      name: "Set Force DHW"
    # Force defrost: service function, leave off.
    set12:
      name: "Set Force Defrost"  # service function - leave off
    # Force sterilization: service function, leave off.
    set13:
      name: "Set Force Sterilization"  # service function - leave off
    # Pump service mode (max speed), leave off.
    set14:
      name: "Set Pump"
    # --- Schedule / sensors / buffer / external ---
    # Main weekly schedule ON/OFF.
    set24:
      name: "Set Main Schedule"
    # Alternative outdoor sensor ON/OFF.
    set25:
      name: "Set Alt External Sensor"
    # Buffer tank installed ON/OFF.
    set28:
      name: "Set Buffer"
    # External control switch.
    set30:
      name: "Set External Control"
    # External error signal.
    set31:
      name: "Set External Error"
    # External compressor control.
    set32:
      name: "Set External Compressor Control"
    # External heat/cool control.
    set33:
      name: "Set External Heat Cool Control"
    # Bivalent control.
    set34:
      name: "Set Bivalent Control"
    # Reset/restart the heat pump (clears latched errors).
    error_reset:
      name: "Error Reset"
    # --- new HeishaMon parity switches ---
    # WARNING: force_heater is the remote's "Heater" button and deliberately
    # runs the 3 kW backup heater. Uncomment only while diagnosing.
    #force_heater:
    #  name: "Force Heater"
    # Enable/disable the quiet-mode schedule (top3).
    quiet_mode_schedule:
      name: "Quiet Mode Schedule"

select:
  - platform: panasonic_heatpump
    # Cooling is disabled in the heat pump custom menu.
    cool_mode: false
    # --- User modes ---
    # Holiday mode: Off / Scheduled / Active.
    set2:
      name: "Set Holiday Mode"
    # Quiet mode: Off / Level 1 / 2 / 3 (caps compressor/fan).
    set3:
      name: "Set Quiet Mode"
    # Powerful mode: Off / 30 / 60 / 90 min.
    set4:
      name: "Set Powerful Mode"
    # --- Operation / zones ---
    # Operation mode: TANK / HEAT / HEAT+TANK (COOL/AUTO only with cool_mode).
    set9:
      name: "Set Operation Mode"
    # Active zones: Zone 1 / Zone 2 / Zone 1 & 2.
    set17:
      name: "Set Zones"
    # External pad heater: Disabled / Type-A / Type-B.
    set26:
      name: "Set External PadHeater"
    # --- Bivalent / heating control ---
    # Bivalent mode: Alternative / Parallel / Advanced parallel.
    set35:
      name: "Set Bivalent Mode"
    # Heating control: Comfort (fast) / Efficiency (compressor ramp limit; can trigger the heater at low flow temps).
    set39:
      name: "Set Heating Control"
    # Smart DHW: Variable / Standard.
    set40:
      name: "Set Smart DHW"
    # Quiet priority: Sound / Capacity.
    set41:
      name: "Set Quiet Mode Priority"
    # Pump flow rate mode: DeltaT (variable, efficient) / Max. duty (fixed).
    set42:
      name: "Set Pump Flow Rate Mode"
    # --- DHW sensor / heater permission ---
    # DHW sensor selection: Top / Center (All-In-One).
    set43:
      name: "Set DHW Sensor Selection"
    # DHW backup/booster heater: Blocked / Free. Use Blocked to stop heater in DHW.
    set44:
      name: "Set DHW Heater State"
    # Room backup heater: Blocked / Free. Use Blocked to stop heater in heating.
    set45:
      name: "Set Room Heater State"

climate:
  - platform: panasonic_heatpump
    # Cooling is disabled on this unit (Cooling Enable = off), so use a
    # single-point heat target. Set true only after unlocking COOL.
    cool_mode: false
    # DHW tank target (20..65 °C).
    tank:
      name: "DHW"
    # Zone 1 water target. In Direct mode use min 20 / max 60; in shift mode -5..5.
    zone1:
      name: "Zone 1"
      # Direct heating mode range (K-series). Use -5..5 for shift mode.
      min_temperature: 20
      max_temperature: 60
      temperature_step: 1
    # Zone 2 water target (same rules as zone1).
    zone2:
      name: "Zone 2"
      min_temperature: 20
      max_temperature: 60
      temperature_step: 1

